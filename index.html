<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PreoCryptoFX | AI Trading Platform</title>
    <meta name="description" content="PreoCryptoFX offers a secure, professional cryptocurrency trading experience with advanced AI-powered tools, real-time analytics, and 24/7 support for every level of trader." />
    
    <!-- Theme & App Manifest -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('preocrypto_theme') || 'dark';
          var isDark = theme === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          
          var themeColor = isDark ? '#020617' : '#ffffff';
          var statusBarStyle = isDark ? 'black' : 'default';
          
          var updateMeta = function(name, value) {
            var meta = document.querySelector('meta[name="' + name + '"]');
            if (!meta) {
              meta = document.createElement('meta');
              meta.name = name;
              document.head.appendChild(meta);
            }
            meta.setAttribute('content', value);
          };

          updateMeta('theme-color', themeColor);
          updateMeta('apple-mobile-web-app-status-bar-style', statusBarStyle);
          updateMeta('color-scheme', isDark ? 'dark' : 'light');

          // Ensure the theme class is applied to prevent transition flashes
          document.documentElement.style.backgroundColor = themeColor;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="debug-marker" style="position: fixed; top: 10px; right: 10px; font-size: 10px; color: #ccc; z-index: 9999;">V1.1</div>
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #666;">
        <div style="text-align: center;">
          <h2 style="margin-bottom: 10px;">PreoCryptoFX</h2>
          <p>Initializing secure trading environment...</p>
          <div style="margin-top: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-left: auto; margin-right: auto;"></div>
          <style>
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          </style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://pay.hashback.co.ke/hashpay.js"></script>
  </body>
</html>
